<!DOCTYPE html>
<html lang="tr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>JSON Sonucu</title>
	<style>
		body { margin: 0; background: #fff; color: #111; font: 15px/1.5 Arial, sans-serif; }
		main { max-width: 1000px; margin: 40px auto; padding: 0 18px 48px; }
		header { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
		h1 { margin: 0; font-size: 32px; } p { color: #666; }
		.actions { display: flex; gap: 10px; flex-wrap: wrap; }
		button, a { border: 1px solid #111; border-radius: 2px; padding: 10px 14px; cursor: pointer; font: inherit; font-weight: 700; text-decoration: none; }
		button { background: #111; color: #fff; } a { background: #fff; color: #111; }
		pre { margin: 0; padding: 22px; overflow: auto; border: 1px solid #999; border-radius: 2px; background: #f7f7f7; color: #111; min-height: 300px; white-space: pre-wrap; }
		#durum { min-height: 24px; color: #444; }
	</style>
</head>
<body>
<main>
	<header><div><h1>JSON Çıktısı</h1><p>Formdan oluşturulan tesis keşif verileri</p></div><div class="actions"><a href="index.html">Forma dön</a><button id="kopyala">JSON'u kopyala</button><button id="indir">JSON indir</button></div></header>
	<p id="durum"></p>
	<pre id="jsonCikti"></pre>
</main>
<script src="script.js"></script>
</body>
</html>
